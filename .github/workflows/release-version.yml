name: Release version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.0.6 or v2.0.6)'
        required: true
        type: string
      mode:
        description: 'commit pushes to the default branch, pr opens a pull request'
        required: true
        default: commit
        type: choice
        options:
          - commit
          - pr

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-version-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version like 2.0.6 or v2.0.6, got '$INPUT_VERSION'"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Update version markers
        run: python3 scripts/update_version.py --version "${{ steps.version.outputs.value }}"

      - name: Verify every marker
        run: python3 scripts/update_version.py --check --version "${{ steps.version.outputs.value }}"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to the default branch
        if: steps.changes.outputs.changed == 'true' && inputs.mode != 'pr'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add netfox.podspec netfox/Core/NFX.swift README.md \
            netfox.xcodeproj/project.pbxproj netfoxTests/NFXHelperTests.swift
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: bump netfox version to $VERSION"
          git push origin "HEAD:$BRANCH"

      - name: Create and push the version tag
        if: steps.changes.outputs.changed == 'true' && inputs.mode != 'pr'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::notice::Tag $VERSION already exists; leaving it untouched."
            exit 0
          fi
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
          echo "Created tag $VERSION on $(git rev-parse --short HEAD)"

      - name: Create the GitHub Release
        if: steps.changes.outputs.changed == 'true' && inputs.mode != 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists; leaving it untouched."
            exit 0
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
          echo "Created GitHub Release $VERSION"

      - name: Open a pull request instead
        if: steps.changes.outputs.changed == 'true' && inputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="chore/bump-netfox-$VERSION-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add netfox.podspec netfox/Core/NFX.swift README.md \
            netfox.xcodeproj/project.pbxproj netfoxTests/NFXHelperTests.swift
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: bump netfox version to $VERSION"
          git push -u origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "chore: bump netfox version to $VERSION" \
            --body "Automated version sync from the Release version workflow."

      - name: Note about tagging
        if: steps.changes.outputs.changed == 'true'
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "$MODE" = "pr" ]; then
            echo "::notice::PR opened for $VERSION. No tag or Release created - after merging, tag the merge commit and create the Release manually (see README)."
          else
            echo "::notice::Version bumped to $VERSION; tag and GitHub Release are ready. CocoaPods publishing is still a separate step (see README)."
          fi
