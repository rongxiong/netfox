name: CI

on:
  push:
    branches: [main, master, swiftui]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm-build:
    name: SPM build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift build
        run: swift build

  ios-tests:
    name: iOS unit tests (Swift Testing)
    runs-on: macos-latest
    env:
      SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshot-failures
    steps:
      - uses: actions/checkout@v7
      - name: Select latest stable Xcode
        run: |
          LATEST_XCODE=$(
            ls -d /Applications/Xcode_*.app 2>/dev/null | while read -r x; do
              target=$(readlink "$x" 2>/dev/null || echo "$x")
              echo "$target" | grep -Eqi 'beta|release.candidate' || echo "$x"
            done | sort -V | tail -1
          )
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
      - name: Run netfoxTests
        run: |
          set -o pipefail
          mkdir -p test-results
          xcodebuild test \
            -scheme netfox_ios \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:netfoxTests \
            -resultBundlePath test-results/TestResults-unit.xcresult \
            2>&1 | xcbeautify
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: snapshot-failures
          if-no-files-found: ignore
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results

  ios-ui-tests:
    name: iOS UI tests (demo app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select latest stable Xcode
        run: |
          LATEST_XCODE=$(
            ls -d /Applications/Xcode_*.app 2>/dev/null | while read -r x; do
              target=$(readlink "$x" 2>/dev/null || echo "$x")
              echo "$target" | grep -Eqi 'beta|release.candidate' || echo "$x"
            done | sort -V | tail -1
          )
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
      - name: Run netfoxUITests
        run: |
          set -o pipefail
          mkdir -p test-results-ui
          xcodebuild test \
            -scheme netfox_ios \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:netfoxUITests \
            -resultBundlePath test-results-ui/TestResults-ui.xcresult \
            2>&1 | xcbeautify
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: test-results-ui

  macos-build:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select latest stable Xcode
        run: |
          LATEST_XCODE=$(
            ls -d /Applications/Xcode_*.app 2>/dev/null | while read -r x; do
              target=$(readlink "$x" 2>/dev/null || echo "$x")
              echo "$target" | grep -Eqi 'beta|release.candidate' || echo "$x"
            done | sort -V | tail -1
          )
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
      - name: Build netfox_osx
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme netfox_osx \
            -destination 'platform=macOS' \
            2>&1 | xcbeautify
