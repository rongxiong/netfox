name: CI

on:
  push:
    branches: [main, master, swiftui]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: |
          LATEST_XCODE=$(
            ls -d /Applications/Xcode_*.app 2>/dev/null | while read -r x; do
              target=$(readlink "$x" 2>/dev/null || echo "$x")
              echo "$target" | grep -Eqi 'beta|release.candidate' || echo "$x"
            done | sort -V | tail -1
          )
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Swift Package Manager build
        run: swift build

      - name: Run unit tests (Swift Testing)
        run: |
          set -o pipefail
          mkdir -p test-results
          xcodebuild test \
            -scheme netfox_ios \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:netfoxTests \
            -resultBundlePath test-results/TestResults-unit.xcresult \
            2>&1 | xcbeautify

      - name: Run UI tests (demo app)
        run: |
          set -o pipefail
          mkdir -p test-results-ui
          xcodebuild test \
            -scheme netfox_ios \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:netfoxUITests \
            -resultBundlePath test-results-ui/TestResults-ui.xcresult \
            2>&1 | xcbeautify

      - name: Build macOS framework
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme netfox_osx \
            -destination 'platform=macOS' \
            2>&1 | xcbeautify

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results
          if-no-files-found: ignore

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: test-results-ui
          if-no-files-found: ignore
